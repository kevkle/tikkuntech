services:
  backend:
    build: ./backend
    environment:
      - OPENROUTER_API_KEY
      - CLASSIFIER_MODEL
      - CHAT_MODEL
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
